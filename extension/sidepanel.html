<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Eddie</title>
    <style>
      :root { color-scheme: dark; --bg: #050510; --fg: #d6fbff; --muted: #7fb6c2; --line: #1d3a44; --accent: #3fe8ff; --bad: #ff8a8a; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
      #frame { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--bg); }
      #bar { display: grid; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
      #bar[hidden] { display: none; }
      #note { margin: 0; color: var(--muted); }
      #note.bad { color: var(--bad); }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button.primary { border-color: var(--accent); color: var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Eddie" allow="microphone; clipboard-write"></iframe>
    <div id="bar" hidden>
      <p id="note"></p>
      <div class="row">
        <button id="allow" type="button" class="primary" hidden>Permitir que Eddie lea la página que veo</button>
        <button id="login" type="button" hidden>Iniciar sesión en Eddie</button>
        <button id="window" type="button" hidden>Abrir Eddie en una ventana</button>
      </div>
    </div>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
